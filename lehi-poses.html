<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lehi clothing pose check</title>
    <style>
      body {
        margin: 0;
        background: #e4e0d5;
        font: 16px system-ui;
        color: #28302a;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #labels {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        pointer-events: none;
      }
      span {
        padding: 14px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <script type="module" src="/src/lehi-poses.ts"></script>
  </body>
</html>
